version: '3.8'

services:
  redis:
    image: redis:7.4.1-alpine
    container_name: redis-stable
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"          # Web UI
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: rabbitmq-stable
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest          # đổi thành user của bạn trong prod
      RABBITMQ_DEFAULT_PASS: guest          # đổi thành password mạnh trong prod
      # Hoặc tốt hơn: dùng file secrets hoặc .env
      # RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      # RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  rabbitmq_log:
    driver: local
  redisinsight_data: 
    driver: local

# Optional: nếu muốn dùng file .env để quản lý user/pass an toàn hơn
# Tạo file .env trong cùng thư mục:
# RABBITMQ_USER=your_username
# RABBITMQ_PASS=your_very_strong_password